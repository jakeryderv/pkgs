name: publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Builds with a throwaway key and proves the whole chain works inside real
  # containers. Needs no secrets, so it runs on pull requests from anywhere.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg shellcheck

      # Runs before anything slow: linting takes seconds, the container tests
      # take minutes, and a typo should not wait behind them.
      #
      # Gated at -S warning, which the tree is already clean of. This is a
      # ratchet to keep it that way, not a cleanup task.
      - name: Lint shell
        run: |
          shellcheck -S warning \
            scripts/*.sh \
            packages/*/smoke \
            packages/*/files/usr/bin/*
          # install.sh ships to users, and a syntax error there is a broken
          # bootstrap for every new machine. `sh -n` is dash's own parser
          # rather than shellcheck's, so it is a genuinely separate check.
          sh -n scripts/install.sh

      # Workflow files are the one thing shellcheck cannot see: an invalid
      # expression or a broken `run:` block only shows up by failing a real
      # run, minutes later. actionlint checks the YAML, the expression
      # contexts, and shellchecks every embedded script.
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      # Keyed on the release declarations, so the cache is invalid exactly when
      # a pin changes -- the pins make a stale hit impossible to act on anyway,
      # since fetch-releases.sh re-verifies every file it finds.
      #
      # Barely earns its keep at one small package; it is here for when there
      # are several, or large ones.
      - name: Cache fetched release artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('packages/*/release') }}

      # arm64 packages are indexed but, without this, never installed by
      # anything -- so the second architecture ships untested. Emulated, which
      # is slow but only has to install a few packages.
      - name: Enable arm64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Generate an ephemeral signing key
        run: |
          export GNUPGHOME="$PWD/gnupg"; mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          cat > /tmp/key.batch <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 3072
          Key-Usage: sign
          Name-Real: CI Ephemeral Key (never published)
          Name-Email: ci@example.invalid
          Expire-Date: 1d
          %commit
          EOF
          gpg --batch --generate-key /tmp/key.batch

      - name: Build
        env:
          GNUPGHOME: ${{ github.workspace }}/gnupg
          SIGNER: ci@example.invalid
          UPDATE_PINS: "1"   # ephemeral key, so pins are regenerated not enforced
        run: |
          # The ephemeral key is not in the committed keyring, and build-repo.sh
          # rightly refuses to sign with a key installed machines do not trust.
          # Point the keyring at this key so the throwaway build is internally
          # consistent -- the same move a real rotation makes, not a bypass.
          ./scripts/update-keyring.sh ci@example.invalid
          ./scripts/build-deb.sh
          ./scripts/fetch-releases.sh
          ./scripts/build-repo.sh

      - name: Verify install in Debian and Ubuntu
        env:
          TEST_ARCHES: amd64 arm64
        run: ./scripts/test-repo.sh

      # The rotation path cannot be checked by inspection: it only shows up
      # when a machine installed under one key has to survive the switch to
      # another using nothing but apt.
      - name: Verify key rotation
        run: ./scripts/test-rotation.sh

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY is not set — refusing to publish an unsigned repository"
            exit 1
          fi
          export GNUPGHOME="$PWD/gnupg"; mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build and sign
        env:
          GNUPGHOME: ${{ github.workspace }}/gnupg
          SIGNER: ${{ vars.SIGNER_UID || 'pkgs@jvs.sh' }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./scripts/build-deb.sh
          ./scripts/fetch-releases.sh   # fails closed if an asset drifts from its pin
          ./scripts/build-repo.sh       # fails if install.sh pins drift from the key

      - name: Publish to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER: npx --yes wrangler@4
        run: ./scripts/publish.sh

      # Publishing successfully is not the same as being installable: a
      # bootstrap file missing from the upload list leaves every other check
      # green while new machines cannot install at all.
      - name: Verify the published repo installs
        run: |
          docker run --rm debian:stable bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq curl ca-certificates >/dev/null
            curl -fsSL https://pkgs.jvs.sh/install.sh | sh >/dev/null
            apt-get install -y -qq hello-jvs >/dev/null
            hello-jvs
          '
