name: publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Builds with a throwaway key and proves the whole chain works inside real
  # containers. Needs no secrets, so it runs on pull requests from anywhere.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Generate an ephemeral signing key
        run: |
          export GNUPGHOME="$PWD/gnupg"; mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          cat > /tmp/key.batch <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 3072
          Key-Usage: sign
          Name-Real: CI Ephemeral Key (never published)
          Name-Email: ci@example.invalid
          Expire-Date: 1d
          %commit
          EOF
          gpg --batch --generate-key /tmp/key.batch

      - name: Build
        env:
          GNUPGHOME: ${{ github.workspace }}/gnupg
          SIGNER: ci@example.invalid
          UPDATE_PINS: "1"   # ephemeral key, so pins are regenerated not enforced
        run: |
          ./scripts/build-deb.sh
          ./scripts/build-repo.sh

      - name: Verify install in Debian and Ubuntu
        run: ./scripts/test-repo.sh

      # install.sh ships to users; a syntax error there is a broken bootstrap
      # for every new machine.
      - name: Lint install.sh
        run: sh -n scripts/install.sh

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY is not set — refusing to publish an unsigned repository"
            exit 1
          fi
          export GNUPGHOME="$PWD/gnupg"; mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build and sign
        env:
          GNUPGHOME: ${{ github.workspace }}/gnupg
          SIGNER: ${{ vars.SIGNER_UID || 'pkgs@jvs.sh' }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./scripts/build-deb.sh
          ./scripts/build-repo.sh   # fails if install.sh pins drift from the key

      - name: Publish to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER: npx --yes wrangler@4
        run: ./scripts/publish.sh
