name: autopin

# Watch every package that declares a release, and open a PR when upstream has
# tagged something newer than what is pinned here. The PR auto-merges once
# `verify` passes, so a tool repo's whole release workflow is tagging upstream.
#
# Pull rather than push, deliberately. repository_dispatch needs `contents:
# write` on this repository -- there is no dispatch-only permission -- so every
# tool repo would hold a token that can push here, and pushing here publishes
# under our signing key. The daily schedule needs no token in any tool repo at
# all; one that wants same-minute pickup can trigger `workflow_dispatch` with a
# fine-grained PAT scoped to Actions: write -- enough to ask for a run, not
# enough to change what the run checks.
#
# The PR is not a review moment any more, but it is still the audit trail: a
# diff showing exactly which bytes changed and when each version entered the
# repository, and closing one without merging skips that version for good.
# `verify` gates the merge, and `publish` requires `verify` regardless.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

# A scheduled run and a manual dispatch overlapping would race on the same
# deterministic branch names. Queued rather than cancelled: a run interrupted
# after pushing a branch but before opening its PR leaves work half done.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Read-only for github.token: the real work runs on AUTOPIN_TOKEN, a
# fine-grained PAT (contents + pull requests, this repository only). Not a
# convenience -- branches pushed with github.token never trigger pull_request
# workflows, so a PR opened that way waits forever on a required `verify` that
# never starts, and auto-merge waits with it.
permissions:
  contents: read

jobs:
  autopin:
    runs-on: ubuntu-latest
    steps:
      # Before checkout on purpose: an empty token would fail there anyway,
      # just with a worse error.
      - name: Require AUTOPIN_TOKEN
        env:
          GH_TOKEN: ${{ secrets.AUTOPIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AUTOPIN_TOKEN is not set — PRs pushed with github.token never start verify, so they could never merge"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.AUTOPIN_TOKEN }}
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Check for newer releases and open PRs
        env:
          GH_TOKEN: ${{ secrets.AUTOPIN_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          opened=0 checked=0
          for def in packages/*/; do
            rel="$def/release"
            [ -f "$rel" ] || continue
            name="$(basename "$def")"
            checked=$((checked+1))

            repo="$(awk '$1=="Repo:"{print $2; exit}' "$rel")"
            pinned="$(awk '$1=="Tag:"{print $2; exit}' "$rel")"

            latest="$(gh release view --repo "$repo" --json tagName --jq .tagName 2>/dev/null || true)"
            if [ -z "$latest" ]; then
              echo "  $name: no releases upstream, skipping"
              continue
            fi
            if [ "$latest" = "$pinned" ]; then
              echo "  $name: up to date ($pinned)"
              continue
            fi
            echo "  $name: $pinned -> $latest"

            # Deterministic branch name, and the guard looks for a PR rather
            # than a branch. Two reasons: a run that pushed a branch and then
            # failed must be able to retry, and a PR closed without merging is
            # a decision to skip that version -- reopening it every morning
            # would be worse than useless.
            branch="autopin/$name-$latest"
            if [ -n "$(gh pr list --head "$branch" --state all --json number --jq '.[0].number // empty')" ]; then
              echo "    already proposed, skipping"
              continue
            fi

            # Asset filenames usually carry the version, so a new tag means new
            # names -- bumping Tag alone would leave the file pointing at
            # artifacts that no longer exist. Take the names from the release
            # itself rather than guessing at a naming convention.
            assets="$(gh release view "$latest" --repo "$repo" --json assets \
                      --jq '.assets[].name | select(endswith(".deb"))')"
            if [ -z "$assets" ]; then
              echo "    release has no .deb assets, skipping"
              continue
            fi

            git checkout -q -B "$branch" origin/main

            # Regenerates the file rather than editing it. Fine for the current
            # single-version format; revisit if multi-version retention lands,
            # since that would have blocks this does not know how to preserve.
            {
              printf 'Repo:   %s\n' "$repo"
              printf 'Tag:    %s\n' "$latest"
              printf '%s\n' "$assets" | while read -r a; do printf 'Asset:  %s\n' "$a"; done
            } > "$rel"

            # Scoped to this package on purpose: a bare --update would re-pin
            # every other package too, silently accepting any change in them.
            ./scripts/fetch-releases.sh --update "$name"

            # Provenance, checked before anything is proposed. The pin proves
            # the bytes have not moved since we looked; this proves they were
            # built by that repository's own workflow.
            for asset in $assets; do
              echo "    verifying provenance of $asset"
              gh attestation verify "vendor/$asset" --repo "$repo"
            done

            if git diff --quiet -- "$rel"; then
              echo "    nothing actually changed, skipping"
              git checkout -q main
              continue
            fi

            git add "$rel"
            git commit -q \
              -m "$name: $pinned -> $latest" \
              -m "Opened by the autopin workflow. Hashes rewritten by fetch-releases.sh, and each asset's build provenance verified against $repo before this PR existed. Merging publishes it."

            printf '%s\n' \
              "Upstream tagged \`$latest\`; this repository pinned \`$pinned\`." \
              "" \
              "Asset names were taken from the release, hashes re-pinned with \`fetch-releases.sh --update $name\`, and build provenance verified with \`gh attestation verify\` against [$repo](https://github.com/$repo)." \
              "" \
              "\`verify\` installs this in Debian and Ubuntu containers and runs the package's smoke test. This PR auto-merges when it passes, and merging publishes. Close the PR to skip this version instead." \
              > /tmp/pr-body.md

            # Force, because a previous run may have pushed this branch and
            # then failed before opening the PR. Safe: the name is
            # bot-generated and, per the guard above, has no PR attached.
            git push -qf origin "$branch"
            gh pr create --title "$name: $pinned -> $latest" \
                         --body-file /tmp/pr-body.md \
                         --head "$branch" --base main
            # --auto waits for the branch protection gate (`verify`), then
            # squashes. Closing the PR first cancels the merge and, per the
            # guard above, skips this version permanently.
            gh pr merge --auto --squash "$branch"
            opened=$((opened+1))
            git checkout -q main
          done

          echo "checked $checked package(s), opened $opened PR(s)"
